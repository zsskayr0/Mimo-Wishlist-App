name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # pubspec.yaml declares .env as an asset (flutter_dotenv) — it's
      # gitignored (real Supabase keys), so analyze/test/build all need
      # *something* there or `flutter analyze` flags the missing asset
      # file as an error. isOptional: true in main.dart means the app
      # just runs unconfigured with these placeholder values; nothing
      # here needs to actually reach Supabase.
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Doesn't need the real release keystore (gitignored, never pushed) —
  # android/app/build.gradle.kts falls back to debug signing when
  # key.properties is absent, which is fine here: this job only proves
  # the release build pipeline itself (packaging, tree-shaking, R8)
  # still works, not that the artifact is distributable.
  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # pubspec.yaml declares .env as an asset (flutter_dotenv) — it's
      # gitignored (real Supabase keys), so analyze/test/build all need
      # *something* there or `flutter analyze` flags the missing asset
      # file as an error. isOptional: true in main.dart means the app
      # just runs unconfigured with these placeholder values; nothing
      # here needs to actually reach Supabase.
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter build apk --release

  build-windows:
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # pubspec.yaml declares .env as an asset (flutter_dotenv) — it's
      # gitignored (real Supabase keys), so analyze/test/build all need
      # *something* there or `flutter analyze` flags the missing asset
      # file as an error. isOptional: true in main.dart means the app
      # just runs unconfigured with these placeholder values; nothing
      # here needs to actually reach Supabase.
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter build windows --release
